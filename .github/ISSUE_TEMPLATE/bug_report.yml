name: Bug report
description: Something specloop did, or didn't do, that it should have
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. [Troubleshooting](https://github.com/KVTaniguchi/specloop/blob/main/docs/troubleshooting.md) covers the common setup problems, and `tools/specloop doctor` checks for most of them.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `tools/specloop doctor`
      description: Run it at the project root.
      render: text
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: Output of `tools/specloop status`
      render: text
  - type: textarea
    id: log
    attributes:
      label: The sync's log, if a sync failed
      description: "`claude logs <id>` (the id is in the `status` line), or `.git/specloop/logs/<sha>.log` for Cursor. Remove anything private."
      render: text
  - type: dropdown
    id: harness
    attributes:
      label: Coding agent
      options:
        - Claude Code
        - Cursor
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: specloop version
      description: "`specloop --version`"
      placeholder: specloop 0.1.2
    validations:
      required: true
